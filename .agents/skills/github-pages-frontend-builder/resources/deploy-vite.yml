# Template: GitHub Pages deploy WITH a Node build step (Vite/React/Vue/etc.)
# Adjust `node-version`, the build command, and the uploaded `path:` to match
# your project (e.g. 'dist' for Vite, 'build' for Create React App).
# Remember: for a *project* page (https://<user>.github.io/<repo>/), set the
# bundler's base path (e.g. Vite's `base: '/<repo>/'`) BEFORE building.

name: Build and deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist" # <-- change to 'build' for CRA, etc.

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
