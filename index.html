<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HotBone 文華哈棒隊 | 火力哈棒場！</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0d0005; /* 深色背景襯托火焰風格 */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .img-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .img-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* 確保整張圖完整顯示不被裁切 */
        }
    </style>
</head>
<body>
    <div class="img-container">
        <!-- 請將 src 中的圖片名稱替換為你的檔名 -->
        <img src="index.png" alt="HotBone 文華哈棒隊 火力哈棒場！">
    </div>
</body>
</html>
